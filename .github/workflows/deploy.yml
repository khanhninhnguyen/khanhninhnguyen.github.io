name: deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Update from v2 to v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true # Replaces manual actions/cache@v4 step
    - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

    - name: Install extra deps
      run: npm install -g mermaid.cli

    - name: Setup deploy options
      id: setup
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # New syntax for outputs in 2026
        if [[ ${GITHUB_REF} = refs/pull/*/merge ]]; then
          echo "SRC_BRANCH=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT
          echo "NO_PUSH=--no-push" >> $GITHUB_OUTPUT
        elif [[ ${GITHUB_REF} = refs/heads/* ]]; then
          echo "SRC_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        fi
        echo "DEPLOY_BRANCH=gh-pages" >> $GITHUB_OUTPUT

    - name: Deploy website 
      run: |
        yes | bash bin/deploy --verbose ${{ steps.setup.outputs.NO_PUSH }} \
                    --src ${{ steps.setup.outputs.SRC_BRANCH }} \
                    --deploy ${{ steps.setup.outputs.DEPLOY_BRANCH }}
